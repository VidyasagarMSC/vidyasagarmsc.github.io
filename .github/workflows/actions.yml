name: scrape-and-deploy

on:
  schedule:
    - cron: "0 0 * * 6" # runs every Saturday at 00:00 UTC
  workflow_dispatch: # allow manual trigger

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RSS scraper
        run: python scrape.py

      - name: Run citation scraper (OpenAlex)
        run: python scrape_citations.py

      - name: Run latest posts scraper
        run: python scrape_latest_posts.py || echo "latest posts scrape optional"

      - name: Commit scraped data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/data/ || true
          git add data/ || true
          git diff --cached --quiet || git commit -m "chore: update scraped data [skip ci]"
          git push

      # No Node.js build step - site is pure HTML/CSS/JS served from root
      # GitHub Pages should be configured to serve from master/main branch root
